# dbc configuration — copy to ./dbc.toml or ~/.config/dbc/config.toml

# Directory scanned for Go scripts (Ctrl+O in the TUI)
scripts_dir = "scripts"

# Query results are truncated at this many rows in the client
max_rows = 1000

# ...and at most this many of them are drawn in the results table. Raise
# max_rows for a bigger export without making the table crawl; the rows past
# this cap are still fetched, and still exported. 0 draws all of them.
max_display_rows = 2000

# A pooled connection that sits unused this long is closed, and reopened the
# next time it is needed — so a dbc left open overnight gives its server
# connections back. Write a duration string ("30m", "2h"); "0" never closes
# them. The editor's pinned session is always in use, so it is never expired.
conn_idle_timeout = "1h"

# How long opening a connection (dial, handshake, first ping) may take before
# it is reported as failed — a wrong host or a down VPN shows up in seconds
# rather than at the OS's minute-plus TCP timeout. "0" sets no limit of dbc's
# own; a timeout in the DSN itself still applies, whichever is shorter. Either
# way, Ctrl+K (or Ctrl+C) abandons a connect that is taking too long.
connect_timeout = "5s"

# Palette of the plan pictures drawn outside the browser — `dbc explain -t
# pdf|jpeg|png` and the TUI's Save as PDF / JPEG: "dark" (dbc's own) or
# "light" (paper, for a PDF that will be printed). `dbc explain --theme`
# overrides it for one run. dbc web's files follow the view's light or dark.
plan_theme = "dark"

# AI assistant. dbc runs an Agent Client Protocol agent as a subprocess and
# never holds a credential itself: "copilot" (the default) is GitHub's
# copilot-language-server, signed in once from any editor that uses it;
# "claude" is claude-code-acp and "gemini" is the gemini CLI.
ai_agent = "copilot"
# Preferred model id; the agent's default when unset or no longer offered.
# ai_model = "claude-sonnet-5"
# The query and its error always go with a question. Result ROWS go only on
# connections with ai_rows = true, and at most this many (0 = none).
ai_context_rows = 10

# Connection activated at startup.
#
# With no config file at all, dbc instead starts on its two built-in demo
# connections — "demo-bytdb" (bytdb, a file in the OS cache dir) and "demo"
# (in-memory SQLite) — both seeded with the same cats table. bytdb is the
# active one; `dbc --demo sqlite` or DBC_DEMO=sqlite flips that. Once this file
# exists, default_connection below is what decides, and --demo does nothing.
default_connection = "local-pg"

[[connection]]
name   = "local-pg"
driver = "postgres"
# Env vars are expanded — keep secrets out of the file
dsn    = "postgres://postgres:${PGPASS}@localhost:5432/mydb?sslmode=disable"
# Directory `dbc migrate` reads for this connection (else --dir, else ".")
migrations = "db/migrate"

[[connection]]
name   = "reporting-mysql"
driver = "mysql"
dsn    = "reporter:${MYSQL_PASS}@tcp(db.example.com:3306)/reports?parseTime=true"

[[connection]]
name   = "scratch"
driver = "sqlite"
dsn    = "file:scratch.db"
# Let the AI assistant see up to ai_context_rows rows of results here. Off by
# default: rows are your data, so each connection opts in on its own.
ai_rows = true

# bytdb is embedded like sqlite — the DSN is just the file, created on first
# open. No in-memory mode, and no server to start.
[[connection]]
name   = "notes"
driver = "bytdb"
dsn    = "notes.bytdb"
