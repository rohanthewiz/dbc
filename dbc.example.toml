# dbc configuration — copy to ./dbc.toml or ~/.config/dbc/config.toml

# Directory scanned for Go scripts (Ctrl+O in the TUI)
scripts_dir = "scripts"

# Query results are truncated at this many rows in the client
max_rows = 1000

# ...and at most this many of them are drawn in the results table. Raise
# max_rows for a bigger export without making the table crawl; the rows past
# this cap are still fetched, and still exported. 0 draws all of them.
max_display_rows = 2000

# Connection activated at startup.
#
# With no config file at all, dbc instead starts on its two built-in demo
# connections — "demo-bytdb" (bytdb, a file in the OS cache dir) and "demo"
# (in-memory SQLite) — both seeded with the same cats table. bytdb is the
# active one; `dbc -demo sqlite` or DBC_DEMO=sqlite flips that. Once this file
# exists, default_connection below is what decides, and -demo does nothing.
default_connection = "local-pg"

[[connection]]
name   = "local-pg"
driver = "postgres"
# Env vars are expanded — keep secrets out of the file
dsn    = "postgres://postgres:${PGPASS}@localhost:5432/mydb?sslmode=disable"

[[connection]]
name   = "reporting-mysql"
driver = "mysql"
dsn    = "reporter:${MYSQL_PASS}@tcp(db.example.com:3306)/reports?parseTime=true"

[[connection]]
name   = "scratch"
driver = "sqlite"
dsn    = "file:scratch.db"

# bytdb is embedded like sqlite — the DSN is just the file, created on first
# open. No in-memory mode, and no server to start.
[[connection]]
name   = "notes"
driver = "bytdb"
dsn    = "notes.bytdb"
