# Release pipeline for dbc, shaped after ../ced's. Triggers on every push to
# the `release` branch (fast-forward it to main when you want to ship):
#
#   1. Picks the version. If the pushed commit hand-edited version/version.go
#      (a deliberate major/minor bump), that version is used as-is. Otherwise
#      the patch number is bumped and the change is committed back to
#      `release` with [skip ci], together with the same number in
#      cats-plugin.toml.
#   2. Tags v<x.y.z> and pushes the tag. The tag is what
#      `go install github.com/rohanthewiz/dbc@latest` and
#      `catctl plugin install rohanthewiz/dbc --ref v<x.y.z>` resolve.
#   3. Runs goreleaser to build linux/darwin × amd64/arm64 archives and attach
#      them to a GitHub Release.
#
# main is left untouched: merge `release` back into main afterwards so its
# version.go and manifest carry the released number.
#
#   main ──●──●──●───────────────●── (merge release back)
#                 \             /
#   release ───────●──[bump]──●
#                  push   CI commits "Release vX.Y.Z [skip ci]" + tag

name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

# Pushing the bump commit and the tag back needs write access to contents.
permissions:
  contents: write

# Two releases racing would both read the same current version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the version step diffs HEAD~1, and goreleaser needs
          # prior tags for the changelog.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Gate the release on the suite: a tag is hard to take back once
      # `go install @latest` and plugin installs have resolved it.
      - name: Test
        run: go test ./...

      - name: Determine version
        id: version
        run: |
          set -euo pipefail

          CURRENT=$(sed -nE 's/.*const Version = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' version/version.go)
          if [[ -z "$CURRENT" ]]; then
            echo "Could not parse version from version/version.go" >&2
            exit 1
          fi

          # A pushed commit that changed version.go is a manual bump: use it.
          # Anything else auto-bumps the patch.
          if git diff --name-only HEAD~1..HEAD 2>/dev/null | grep -qx 'version/version.go'; then
            echo "Version was manually edited to $CURRENT — using as-is."
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "bumped=false"     >> "$GITHUB_OUTPUT"
          else
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "Auto-bumping $CURRENT → $NEW"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
            echo "bumped=true"  >> "$GITHUB_OUTPUT"
          fi

      # Configured unconditionally: `git tag -a` needs an identity even on the
      # manual-bump path, where the bump-commit step is skipped (ced shipped
      # with this inside the bump step and every manual bump died with
      # "empty ident name").
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # [skip ci] keeps this push from re-triggering the workflow.
      - name: Commit version bump
        if: steps.version.outputs.bumped == 'true'
        run: |
          set -euo pipefail
          NEW="${{ steps.version.outputs.version }}"

          sed -i -E "s/(const Version = )\"[0-9]+\.[0-9]+\.[0-9]+\"/\1\"$NEW\"/" version/version.go
          # Anchored at line start: the manifest's only top-level version key.
          # TestVersion_MatchesCatsManifest fails the tree if these two differ.
          sed -i -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/version = \"$NEW\"/" cats-plugin.toml

          git add version/version.go cats-plugin.toml
          git commit -m "Release v$NEW [skip ci]"
          git push origin HEAD:release

      - name: Tag release
        run: |
          set -euo pipefail
          NEW="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v$NEW" >/dev/null; then
            echo "Tag v$NEW already exists, skipping."
            exit 0
          fi
          git tag -a "v$NEW" -m "dbc v$NEW"
          git push origin "v$NEW"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
