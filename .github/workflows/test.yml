# Test pipeline for dbc: build, vet and `go test -race ./...` on Linux and
# macOS for every push to main and every pull request. The live Postgres and
# MySQL tests (db/live_*) skip themselves without their DSN env vars, so this
# needs no database services.

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux pinned as release.yml's runner is, so the tests run on the
        # image the release is built on
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod / go.sum are not tidy. Run 'go mod tidy' and commit." >&2
            git --no-pager diff go.mod go.sum
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # A brief run of every fuzz target (N-302), Linux only: `go test`
      # above already replays their seeds and testdata/fuzz corpora; this
      # explores a little past them on every push. `-fuzz` takes one
      # target per package per run, hence the loop. A failure leaves its
      # input under testdata/fuzz in the log's path, to be committed as a
      # seed with the fix. Longer runs are by hand (each target's doc).
      - name: Fuzz (brief)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -e
          for t in sqlsplit:FuzzSplit sqlsplit:FuzzFormat sqlsplit:FuzzSplitEdit \
                   sqlcomplete:FuzzComplete designer:FuzzImport \
                   explain:FuzzParsePostgresJSON explain:FuzzParsePostgresText \
                   explain:FuzzParseMySQLTree explain:FuzzParseTabular jobs:FuzzParseCron; do
            pkg=${t%%:*}; fn=${t##*:}
            echo "::group::$fn"
            go test -run '^$' -fuzz "^${fn}\$" -fuzztime 10s "./$pkg"
            echo "::endgroup::"
          done
