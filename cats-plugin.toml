# cats-plugin.toml registers dbc with the cats plugin host.
#
#   Install:            catctl plugin install rohanthewiz/dbc
#   Local development:  catctl plugin link .   (from this checkout)
#   Launch:             catctl plugin run rohanthewiz.dbc
#
# Written against ../cats-todo/cats-plugin.toml, the reference manifest, and
# shaped like ../gonotes/cats-plugin.toml, the other plugin that is also a
# cats-native client.
#
# BEING A PLUGIN AND BEING A CATS-NATIVE CLIENT ARE ORTHOGONAL, and dbc is
# both. The native side (cats/, tui/cats.go) is what the TUI does once it
# is running in a cats pane — working/idle hook reports, the host's theme, ⌘
# accelerators, ^G handing a statement to a sibling agent — and it works the
# same whether the pane was opened by this manifest, by `dbc` typed into a
# shell, or by nothing at all. This file answers a different question: how the
# pane gets opened from the ⌘K palette instead of from a shell, and what kind of
# tool cats should take it for once it is open.

id = "rohanthewiz.dbc"
name = "dbc"
# Informational only; the host does not compare it. version/version.go is the
# source of truth: release CI (.github/workflows/release.yml) rewrites this line
# in the same commit as its auto-bump, and TestVersion_MatchesCatsManifest fails
# when the two disagree, so a hand-pinned version must be edited in both places.
version = "0.2.1"
description = "A terminal database client for Postgres, MySQL, SQLite and bytdb, scriptable in Go: run the statement under the cursor, explain its plan (tree, flame graph, fixes), browse tables, recall history, export results as CSV, Markdown, HTML or JSON, and drive whole query loops from a .go script. `dbc web` serves the same workbench in a browser."
platforms = ["linux", "macos"]
# What kind of tool this is. A database client is not an LLM agent, so cats
# never offers its pane as a drop target for a prompt, even though dbc reports
# working/idle over the hook API the way an agent does (that reporting is what
# earns a long query its completion badge and toast). It also lets another
# client find "the database tool" by plugin_type in pane.list without knowing
# this id. A cats older than the key ignores it (unknown types are treated as
# unset).
type = "db_client"

# Expose the built binary on the user's PATH. The host symlinks it into the cats
# bin dir (~/.cats/bin/dbc -> <plugins-root>/<id>/bin/dbc), which `catctl
# shellinit` and every cats pane put first on PATH, so `dbc "SELECT …"` typed in
# a shell — or run by an agent — is the same build the action below launches,
# rather than a hand-built copy that drifts. Top-level key, so it sits above the
# [[build]] tables.
bin = ["./bin/dbc"]

# Build at install/link time, in the plugin root. dbc is pure Go (modernc
# SQLite, bytdb, pgx, go-sql-driver — no cgo), so this needs nothing beyond a Go
# toolchain.
#
# The output goes to bin/ rather than the repo root on purpose: /dbc is already
# .gitignore'd as the hand-built binary, and giving the plugin host its own copy
# means a `go build .` in a working tree cannot leave a half-built binary where
# a plugin launch will find it.
[[build]]
command = ["sh", "-c", "mkdir -p bin && go build -o bin/dbc ."]

# The TUI, first so a bare `plugin run` opens it.
#
# NO -config FLAG, DELIBERATELY. An action's argv[0] is anchored to the plugin
# root, but the pane it opens in has the USER'S project as its cwd — and that
# is exactly what dbc's config lookup wants: ./dbc.toml first, so a project
# that keeps its connections next to its code gets them, then
# ~/.config/dbc/config.toml for everything else. Pinning a path here would
# throw the per-project half away. (Spelling it `-config ~/.config/…` would be
# worse still: this argv is exec'd with no shell, so the tilde would not
# expand.)
#
# With neither file present dbc starts on its two seeded demo connections, so a
# fresh install is usable the moment it opens. History, the saved editor buffer
# and the bytdb demo all live under the home directory, not the cwd, so they
# are the same from every tab.
[[actions]]
id = "tui"
title = "dbc — database client"
command = ["./bin/dbc"]

# The browser workbench, beside the TUI: `dbc web` serves it on loopback and
# opens the browser on its one-time sign-in link. The pane it runs in is the
# server's console — the link (for a browser that did not open), shutdown
# progress — and closing the pane (or Ctrl+C in it) stops the server, which
# rolls back what its tabs left open. Same config lookup as the TUI, from the
# user's project directory, and the same history and assistant conversations.
[[actions]]
id = "web"
title = "dbc — web (browser workbench)"
command = ["./bin/dbc", "web"]

# Shell completion for the dbc command itself. `catctl completion <shell>`
# reads this and registers dbc alongside catctl.
#
# The static form, because dbc has no completion code of its own and its
# surface is small: the subcommands in first position (a bare first word is
# otherwise a SQL string, which nothing could complete), and the flags wherever
# a word starts with "-". TestCatsManifest_CompletionsCoverCLI (manifest_test.go)
# compares these lists with newCLI both ways, so a flag added, renamed or
# dropped in Go fails the tests until it is changed here too.
[[completions]]
binary = "dbc"
subcommands = ["script", "migrate", "explain", "web"]
flags = ["--config", "-c", "--conn", "-f", "--file", "-t", "--format", "-o", "--out",
         "--tx", "-k", "--keep-going",
         "--demo", "--driver", "--dsn", "--dir", "--allow-missing",
         "-a", "--analyze", "--open", "--fail-on", "--theme",
         "--listen", "--no-open", "--secret", "--help", "-v", "--version"]
