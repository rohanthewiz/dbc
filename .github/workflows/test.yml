# Test pipeline for dbc: build, vet and `go test -race ./...` on Linux and
# macOS for every push to main and every pull request. The live Postgres and
# MySQL tests (db/live_*) skip themselves without their DSN env vars, so this
# needs no database services.

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux pinned as release.yml's runner is, so the tests run on the
        # image the release is built on
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod / go.sum are not tidy. Run 'go mod tidy' and commit." >&2
            git --no-pager diff go.mod go.sum
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # staticcheck (N-304), built with the module's Go — a binary built
      # with an older Go refuses this module. Pinned, so a new release's
      # checks arrive as a change of their own. A finding is fixed, or kept
      # with a //lint:ignore <check> <reason> beside it (the legacy PEM
      # decryption in db/tlskey.go, driver.Conn's Begin in db/mysqlkill.go).
      - name: Staticcheck
        if: matrix.os == 'ubuntu-24.04'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Test
        run: go test -race ./...

      # A brief run of every fuzz target (N-302), Linux only: `go test`
      # above already replays their seeds and testdata/fuzz corpora; this
      # explores a little past them on every push. `-fuzz` takes one
      # target per package per run, hence the loop. A failure leaves its
      # input under testdata/fuzz in the log's path, to be committed as a
      # seed with the fix. Longer runs are by hand (each target's doc).
      - name: Fuzz (brief)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -e
          for t in sqlsplit:FuzzSplit sqlsplit:FuzzFormat sqlsplit:FuzzSplitEdit \
                   sqlcomplete:FuzzComplete designer:FuzzImport \
                   explain:FuzzParsePostgresJSON explain:FuzzParsePostgresText \
                   explain:FuzzParseMySQLTree explain:FuzzParseTabular jobs:FuzzParseCron; do
            pkg=${t%%:*}; fn=${t##*:}
            echo "::group::$fn"
            go test -run '^$' -fuzz "^${fn}\$" -fuzztime 10s "./$pkg"
            echo "::endgroup::"
          done

  # The live Postgres and MySQL suites (N-305): every TestLive* test, which
  # skips itself without DBC_LIVE_PG_DSN / DBC_LIVE_MYSQL_DSN, against
  # throwaway service containers. Sessions, cancels, transactions and the
  # catalog reads are what these pin, and nothing else in CI reaches a real
  # server. -p 1: the packages share one database of each kind (their
  # schemas and tables are named apart, but a parallel run of the designer
  # and the navigator once raced on one). The databases are named dbc, as
  # the live tests' docs have it: the TUI's navigator test picks its way
  # back to the DSN's own database by typing its name. The TLS and Docker
  # suites stay opt-in by hand.
  live:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: dbc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: dbc
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw"
          --health-interval 2s --health-timeout 5s --health-retries 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Live tests
        env:
          DBC_LIVE_PG_DSN: postgres://postgres:pw@127.0.0.1:5432/dbc?sslmode=disable
          DBC_LIVE_MYSQL_DSN: root:pw@tcp(127.0.0.1:3306)/dbc
        run: go test -p 1 -count=1 -run Live ./...
